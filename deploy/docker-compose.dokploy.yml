# Конфігурація для панелей керування з власним реверс-проксі (Dokploy та
# подібні). Відрізняється від docker-compose.yml відсутністю сервісу Caddy:
# HTTPS і маршрутизацію забезпечує проксі панелі.
#
# У панелі потрібно створити два маршрути на один домен:
#   шлях /     -> сервіс web, порт 8080
#   шлях /api  -> сервіс api, порт 8080
#
# Інструкція — docs/deployment/quick-start.md.

name: crm

services:
  web:
    image: ghcr.io/uniia-ave-team/crm-web:${CRM_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/uniia-ave-team/crm-api:${CRM_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?змінна AUTH_SIGNING_KEY не задана}
      Crm__PublicUrl: https://${DOMAIN:?змінна DOMAIN не задана}
      TZ: ${TZ:-Europe/Kyiv}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?змінна POSTGRES_DB не задана}
      POSTGRES_USER: ${POSTGRES_USER:?змінна POSTGRES_USER не задана}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?змінна POSTGRES_PASSWORD не задана}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - db_data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z1 --clean --if-exists"
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: "8080"
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backups:
