<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM API</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./scalar.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        hideClientButton: true,
        showDeveloperTools: 'never',
        documentDownloadType: 'json',
        agent: { disabled: true },
        mcp: { disabled: true },
        telemetry: false,
      });
    </script>
  </body>
</html>
