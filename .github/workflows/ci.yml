name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
      docs: ${{ steps.filter.outputs.docs }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'global.json'
              - 'dotnet-tools.json'
            web:
              - 'apps/web/**'
              - '.nvmrc'
            contract:
              - 'packages/api-contract/**'
            docs:
              - 'docs/**'
            tooling:
              - '.github/workflows/ci.yml'
              - 'justfile'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Format, build, test
        run: just api-ci

      - name: Check that openapi.json matches the code
        run: just contract-check

      - name: Fetch base branch for the API diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      # Informational: the API has a single consumer released together with it, so breaking changes do not block.
      - name: Report breaking API changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: 'origin/${{ github.base_ref }}:packages/api-contract/openapi.json'
          revision: 'HEAD:packages/api-contract/openapi.json'
          review: false

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install, generate client, lint, test, build
        run: just web-ci

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build the documentation site
        run: just docs-build

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      # Code scanning uploads need a public repository or GitHub Advanced Security.
      - name: Upload results to the Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # The only required status check: green when no job failed; skipped jobs count as success.
  ci-ok:
    if: always()
    needs: [changes, api, web, docs, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
