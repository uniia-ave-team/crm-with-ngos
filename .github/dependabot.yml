version: 2

updates:
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    # The API runs on .NET 10 (global.json, Docker images). A new .NET major needs
    # its SDK and runtime, e.g. ApiDescription.Server 11 fails the build without them,
    # so it moves together with global.json and the images, by hand.
    ignore:
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql*'
        update-types: ['version-update:semver-major']
    groups:
      aspnetcore-efcore:
        patterns:
          - 'Microsoft.AspNetCore.*'
          - 'Microsoft.EntityFrameworkCore*'
          - 'Microsoft.Extensions.*'
          - 'Npgsql*'
      # The managed package and its native assets must stay on the same version.
      skiasharp:
        patterns:
          - 'SkiaSharp*'
      # The source generator must match the abstractions it generates code for.
      mediator:
        patterns:
          - 'Mediator.*'
      testing:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'coverlet.*'
          - 'NSubstitute*'
          - 'Shouldly'
          - 'Bogus'
          - 'Respawn'
          - 'Testcontainers*'

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    # Angular pins a narrow TypeScript range; minor and major bumps come with `ng update`.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - 'typescript'
      ionic-capacitor:
        patterns:
          - '@ionic/*'
          - '@capacitor/*'
          - 'ionicons'
      lint-test:
        patterns:
          - 'eslint'
          - 'typescript-eslint'
          - 'vitest'
          - 'jsdom'

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    # The web build image follows .nvmrc and stays on an LTS line, and the .NET images
    # follow global.json; a new major moves together with them and CI, by hand.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dotnet/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'mcr.microsoft.com/dotnet/*'
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    # A new PostgreSQL major cannot open an existing data volume without pg_upgrade.
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
