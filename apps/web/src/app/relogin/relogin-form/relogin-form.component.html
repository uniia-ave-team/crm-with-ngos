<div class="relogin-form">
  <button type="button" class="relogin-form__back" tabindex="0" (click)="back.emit()">
    <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon>
    <span>{{ 'common.back' | translate }}</span>
  </button>

  <header class="relogin-form__header">
    <h1 class="relogin-form__title">{{ 'relogin.form.title' | translate }}</h1>
    <!-- Смітник забуває збережений акаунт; для нового акаунта його нема. -->
    @if (accountId()) {
      <button
        type="button"
        class="relogin-form__remove"
        tabindex="0"
        [attr.aria-label]="'nav.account.remove' | translate"
        [attr.title]="'nav.account.remove' | translate"
        (click)="remove.emit()"
      >
        <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
      </button>
    }
  </header>

  <app-sign-in-form
    [withServer]="true"
    [accountId]="accountId()"
    [initialServer]="initialServer()"
    [initialEmail]="initialEmail()"
    [afterSignIn]="openApp"
    (serverChange)="onServerChange($event)"
  />
</div>
