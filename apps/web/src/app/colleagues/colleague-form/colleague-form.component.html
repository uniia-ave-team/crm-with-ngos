<form class="settings-form" novalidate (submit)="$event.preventDefault(); submit()">
  <div class="settings-field">
    <label class="settings-field__label" for="colleague-form-email">{{ 'colleagues.colleagueForm.email' | translate }}<span class="settings-field__required" aria-hidden="true" [attr.title]="'common.required' | translate">*</span></label>
    <input
      id="colleague-form-email"
      class="settings-input"
      type="email"
      tabindex="0"
      required
      autocomplete="off"
      [value]="email()"
      (input)="onEmailInput($event)"
    />
    @if (emailError(); as errorKey) {
      <p class="settings-field__error" role="alert">{{ errorKey | translate }}</p>
    }
  </div>

  <app-role-choices [roles]="roles()" [selected]="selected()" [required]="true" [error]="rolesError()" (roleToggle)="toggle($event)" />

  @if (error(); as errorKey) {
    <p class="settings-field__error" role="alert">{{ errorKey | translate }}</p>
  }

  <button type="submit" class="settings-submit" tabindex="0" [disabled]="saving()">{{ 'colleagues.colleagueForm.submit' | translate }}</button>
</form>
