<ion-content [fullscreen]="true" class="join">
  <div class="join__wrap">
    @if (failureKey(); as key) {
      <!-- Невдача (чи посилання без токена): причина й «Назад» на /relogin. -->
      <div class="auth-error" role="alert">
        <p class="auth-error__line join__error-line">{{ key | translate }}</p>
        <p class="auth-error__line join__error-line">
          <button type="button" class="join__link reset-password__back" tabindex="0" (click)="leave()">{{ 'common.back' | translate }}</button>
        </p>
      </div>
    } @else {
      <div class="join__card">
        <h1 class="join__title">{{ 'resetPassword.title' | translate }}</h1>
        <app-password-fields
          [policy]="passwordPolicy()"
          [password]="password()"
          [repeat]="passwordRepeat()"
          [required]="true"
          [passwordLabel]="'resetPassword.password' | translate"
          [repeatLabel]="'resetPassword.passwordRepeat' | translate"
          [passwordError]="passwordError() ? 'resetPassword.error.' + passwordError() : null"
          [repeatError]="passwordRepeatError() ? 'resetPassword.error.' + passwordRepeatError() : null"
          (passwordChange)="onFieldChange(password, $event)"
          (repeatChange)="onFieldChange(passwordRepeat, $event)"
          (submitted)="submit()"
        />

        <ion-button tabindex="0" class="auth-submit" type="button" expand="block" [disabled]="saving()" (click)="submit()">
          {{ (saving() ? 'resetPassword.sending' : 'resetPassword.submit') | translate }}
        </ion-button>
        <button type="button" class="auth-link reset-password__cancel" tabindex="0" (click)="leave()">{{ 'common.cancel' | translate }}</button>
      </div>
    }
  </div>
</ion-content>
