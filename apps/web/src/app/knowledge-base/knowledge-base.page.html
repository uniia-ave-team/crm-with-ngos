      <ion-menu-button menu="secondary"></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'page.knowledgeBase' | translate }}</ion-title>

</ion-header>

<ion-content [fullscreen]="true">

      <ion-title size="large">{{ 'page.knowledgeBase' | translate }}</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>
