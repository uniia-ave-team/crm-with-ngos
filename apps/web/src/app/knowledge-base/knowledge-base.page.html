<ion-header class="kb__header" [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="secondary"></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'page.knowledgeBase' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Смуга дій знизу змісту (вид показує її через ActionBarService, наприклад для вибраної клітинки). -->
  <app-action-bar slot="fixed" />
  <!-- Вид за адресою: «Посібник», таблиця, сторінка чи менеджер шаблонів. Поки видно смугу дій,
       знизу більше місця, щоб вона не закривала останні рядки. -->
  <div class="kb__body" [class.kb__body--with-actions]="actionBar.content() !== null">
    <router-outlet />
  </div>
</ion-content>
