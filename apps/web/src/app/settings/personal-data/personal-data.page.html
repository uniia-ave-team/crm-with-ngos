<h2 class="settings-section__title">{{ 'settings.personal.title' | translate }}</h2>

<!-- Результат останнього збереження: червоний (невдача) або зелений (успіх) блок,
     як на вкладці зміни пароля. -->
@if (resultKey(); as key) {
  <div
    class="settings-result"
    [class.settings-result--success]="result() === 'success'"
    [attr.role]="result() === 'success' ? 'status' : 'alert'"
  >
    {{ key | translate }}
  </div>
}

<!-- Поля, аватар і «Зберегти» — спільна форма профілю (та сама, що в «Редагувати» колеги). -->
<app-profile-form
  idPrefix="settings"
  [profile]="user()"
  [ngoName]="ngoName()"
  [saving]="saving()"
  (changed)="result.set(null)"
  (save)="onSave($event)"
/>
