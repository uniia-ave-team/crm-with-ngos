<h2 class="settings-section__title">{{ 'settings.password.title' | translate }}</h2>

<!-- Результат останньої спроби: червоний (невдача) або зелений (успіх) блок, як
     блок помилок на сторінці входу. -->
@if (resultKey(); as key) {
  <div
    class="settings-result"
    [class.settings-result--success]="result() === 'success'"
    [attr.role]="result() === 'success' ? 'status' : 'alert'"
  >
    {{ key | translate }}
  </div>
}

<form class="settings-form" novalidate (submit)="$event.preventDefault(); submit()">
  <div class="settings-field">
    <label class="settings-field__label" for="settings-current-password">{{ 'settings.password.current' | translate }}<span class="settings-field__required" aria-hidden="true" [attr.title]="'common.required' | translate">*</span></label>
    <input
      id="settings-current-password"
      class="settings-input"
      type="password"
      tabindex="0"
      required
      autocomplete="current-password"
      [value]="currentPassword()"
      (input)="onFieldChange(currentPassword, $any($event.target).value)"
    />
    @if (currentError(); as errorKey) {
      <p class="settings-field__error" role="alert">{{ errorKey | translate }}</p>
    }
  </div>

  <!-- Новий пароль, умови до нього й повтор — ті самі поля, що в реєстрації
       адміністратора на сторінці входу. -->
  <app-password-fields
    class="settings-password-fields"
    [showLabels]="true"
    [required]="true"
    [password]="newPassword()"
    [repeat]="repeatPassword()"
    [passwordLabel]="'settings.password.new' | translate"
    [repeatLabel]="'settings.password.repeat' | translate"
    [passwordError]="newPasswordError()"
    [repeatError]="repeatError()"
    (passwordChange)="onFieldChange(newPassword, $event)"
    (repeatChange)="onFieldChange(repeatPassword, $event)"
    (submitted)="submit()"
  />

  <button type="submit" class="settings-submit" tabindex="0" [disabled]="saving()">
    {{ (saving() ? 'settings.password.saving' : 'settings.password.submit') | translate }}
  </button>
</form>
