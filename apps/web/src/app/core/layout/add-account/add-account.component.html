<app-modal width="min(356px, calc(100vw - 32px))" [label]="titleKey() | translate" (closed)="onClosed()">
  <div class="add-account">
    <header class="add-account__header">
      <h2 class="add-account__title">{{ titleKey() | translate }}</h2>
      <div class="add-account__tools">
        @if (accountId()) {
          <button
            type="button"
            class="add-account__remove"
            tabindex="0"
            [attr.aria-label]="'nav.account.remove' | translate"
            [attr.title]="'nav.account.remove' | translate"
            (click)="remove()"
          >
            <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
          </button>
        }
        <button
          type="button"
          class="add-account__close"
          tabindex="0"
          [attr.aria-label]="'common.close' | translate"
          [attr.title]="'common.close' | translate"
          (click)="close()"
        >
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </header>

    @for (form of forms(); track form) {
      <app-sign-in-form
        [withServer]="true"
        [accountId]="form.accountId"
        [initialServer]="form.server"
        [initialEmail]="form.email"
        [afterSignIn]="openApp"
      />
    }
  </div>
</app-modal>
