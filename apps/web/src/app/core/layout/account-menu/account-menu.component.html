<div class="account-menu">
  <!-- Усі акаунти й кнопка додавання — один flex-контейнер: рядки наповнюються
       суцільно (без порожніх місць), а максимум акаунтів у рядку обмежує його
       ширина (5 плиток). -->
  <div class="account-menu__accounts" role="group" [attr.aria-label]="'nav.account.accounts' | translate">
    @for (account of accounts(); track account.id) {
      <button
        tabindex="0"
        class="account-tile"
        [class.active]="account.active"
        type="button"
        [class.outdated]="account.outdated"
        [class.unavailable]="account.unavailable"
        [attr.aria-label]="
          tooltip(account, 'nav.account.unavailable' | translate, 'nav.account.outdated' | translate) ??
            ('nav.account.account' | translate)
        "
        [attr.title]="tooltip(account, 'nav.account.unavailable' | translate, 'nav.account.outdated' | translate)"
        (click)="selectAccount.emit(account)"
      >
        <app-account-avatar [account]="account" />
      </button>
    }
    <button
      tabindex="0"
      class="account-add"
      type="button"
      [attr.aria-label]="'nav.account.add' | translate"
      [title]="'nav.account.add' | translate"
      (click)="addAccount.emit()"
    >
      <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>

  <button tabindex="0" class="account-menu__item" type="button" (click)="settings.emit()">
    <ion-icon name="cog-outline" aria-hidden="true"></ion-icon>
    <span>{{ 'nav.account.settings' | translate }}</span>
  </button>

  <hr class="account-menu__divider" />

  <button tabindex="0" class="account-menu__item" type="button" (click)="signOut.emit()">
    <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
    <span>{{ 'nav.account.signOut' | translate }}</span>
  </button>
</div>
