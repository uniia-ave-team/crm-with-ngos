<ion-app>
  @if (layout.hideShell()) {
    <!-- Сторінки без оболонки (наразі /login): жодного рейла чи другої
         панелі, просто маршрутизований вміст на всю площу. -->
    <ion-router-outlet></ion-router-outlet>
  } @else {
    <div class="shell">
      <app-primary-nav></app-primary-nav>

      <ion-split-pane contentId="main-content" when="lg">
        @if (layout.section(); as section) {
          <ion-menu
            menuId="secondary"
            contentId="main-content"
            type="overlay"
            when="lg"
            [class.shell__menu--collapsed]="layout.collapsed()"
          >
            <ion-header>
              <ion-toolbar>
                <ion-title>{{ titleKeys[section] | translate }}</ion-title>
                <ion-buttons slot="end">
                  <ion-button
                    (click)="layout.toggleCollapsed()"
                    [attr.aria-label]="(layout.collapsed() ? 'common.expandPanel' : 'common.collapsePanel') | translate"
                  >
                    <ion-icon
                      slot="icon-only"
                      [name]="layout.collapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'"
                    ></ion-icon>
                  </ion-button>
                </ion-buttons>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <app-secondary-panel [section]="section"></app-secondary-panel>
            </ion-content>
          </ion-menu>
          @if (layout.collapsed()) {
            <button
              type="button"
              class="expand-panel"
              (click)="layout.toggleCollapsed()"
              [attr.aria-label]="'common.expandPanel' | translate"
            >
              <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
            </button>
          }
        }
        <ion-router-outlet id="main-content"></ion-router-outlet>
      </ion-split-pane>
    </div>
  }
</ion-app>
