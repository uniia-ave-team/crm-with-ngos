<ion-app>
  @if (layout.hideShell()) {
    <!-- Сторінки без оболонки (наразі /login, /join, /reset-password і /relogin): жодного рейла чи другої
         панелі, просто маршрутизований вміст на всю площу. -->
    <ion-router-outlet></ion-router-outlet>
  } @else {
    <div class="shell">
      <app-primary-nav></app-primary-nav>

      <ion-split-pane contentId="main-content" when="lg">
        @if (layout.section(); as section) {
          <ion-menu
            menuId="secondary"
            contentId="main-content"
            type="overlay"
            when="lg"
            [class.shell__menu--collapsed]="layout.collapsed()"
          >
            <ion-header>
              <ion-toolbar>
                <!-- span потрібен, щоб довга назва переносилась на другий рядок: ion-title сам
                     обрізає її трикрапкою (white-space: nowrap у його shadow DOM). -->
                <ion-title><span class="shell__menu-title">{{ titleKeys[section] | translate }}</span></ion-title>
                <ion-buttons slot="end">
                  <ion-button
                    (click)="layout.toggleCollapsed()"
                    [attr.aria-label]="(layout.collapsed() ? 'common.expandPanel' : 'common.collapsePanel') | translate"
                  >
                    <ion-icon
                      slot="icon-only"
                      [name]="layout.collapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'"
                    ></ion-icon>
                  </ion-button>
                </ion-buttons>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <app-secondary-panel [section]="section"></app-secondary-panel>
            </ion-content>
          </ion-menu>
          @if (layout.collapsed()) {
            <button
              type="button"
              class="expand-panel"
              (click)="layout.toggleCollapsed()"
              [attr.aria-label]="'common.expandPanel' | translate"
            >
              <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
            </button>
          }
        }
        <ion-router-outlet id="main-content"></ion-router-outlet>
      </ion-split-pane>
    </div>
  }

  <!-- Браузер не дав записати акаунти (сховище переповнене): зміни живуть лише до перезавантаження.
       Попередження висить, поки його не закриють. -->
  <ion-toast
    class="storage-full"
    color="warning"
    position="bottom"
    [isOpen]="accounts.storageFull()"
    [message]="'common.storageFull' | translate"
    [buttons]="[{ text: 'common.close' | translate, role: 'cancel' }]"
    (didDismiss)="accounts.dismissStorageFull()"
  ></ion-toast>

  <!-- Оголошення сервера про технічні роботи (`notice` статусу системи): угорі на всіх сторінках,
       поки роботи не скінчились або його не закрили. -->
  @let notice = maintenance.view();
  <ion-toast
    class="maintenance-notice"
    color="warning"
    position="top"
    [isOpen]="notice !== null"
    [header]="notice ? (notice.titleKey | translate: notice.params) : ''"
    [message]="notice?.message ?? ''"
    [buttons]="[{ text: 'common.close' | translate, role: 'cancel' }]"
    (didDismiss)="maintenance.dismiss()"
  ></ion-toast>

  <!-- Повідомлення про успіх, що переживає перехід (наприклад, «Пароль змінено…» після
       /reset-password): угорі, зникає саме. -->
  @let successKey = successNotice.key();
  <ion-toast
    class="success-notice"
    color="success"
    position="top"
    [duration]="6000"
    [isOpen]="successKey !== null"
    [message]="successKey ? (successKey | translate) : ''"
    [buttons]="[{ text: 'common.close' | translate, role: 'cancel' }]"
    (didDismiss)="successNotice.dismiss()"
  ></ion-toast>

  <!-- Прелоадер на всю сторінку: поки шукаємо чинний акаунт серед збережених. -->
  <app-preloader [visible]="accountSearch()"></app-preloader>
</ion-app>
