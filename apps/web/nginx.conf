# Static hosting of the Angular build. The API is a separate service; the client
# finds it at runtime (ConnectionService), so nothing here proxies to it.

# Hashed build output never changes and is cached for a year; everything else is revalidated.
map $uri $cache_control {
    "~^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$"  "public, max-age=31536000, immutable";
    ~^/media/                                 "public, max-age=31536000, immutable";
    default                                   "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A missing file is a 404, not the app shell.
    location ~* \.(?:js|css|json|map|svg|png|jpe?g|gif|webp|ico|otf|ttf|woff2?)$ {
        try_files $uri =404;
    }

    # Client-side routes such as /login fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
