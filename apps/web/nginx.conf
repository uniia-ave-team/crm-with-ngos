# Static hosting of the Angular build. The API is a separate service; the client
# finds it at runtime (ConnectionService), so nothing here proxies to it.
# Behind a reverse proxy /api/ and /health go to the API and never reach this server.

# Hashed build output never changes and is cached for a year; everything else is revalidated.
map $uri $cache_control {
    "~^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$"  "public, max-age=31536000, immutable";
    ~^/media/                                 "public, max-age=31536000, immutable";
    default                                   "no-cache";
}

# Invitation links (/join?token=...) carry a credential in the query string, and the
# page sends its full URL as the Referer of every asset it loads. Log the path only.
map $request_uri $request_path {
    "~^(?<path>[^?]*)"  $path;
}

log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log path_only;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A missing file is a 404, not the app shell.
    location ~* \.(?:js|css|json|map|svg|png|jpe?g|gif|webp|ico|otf|ttf|woff2?)$ {
        try_files $uri =404;
    }

    # The client looks for the API on its own origin first (GET /health). Without a reverse
    # proxy in front, these paths end up here: answer 404, not the app shell, so the client
    # moves on to the API port instead of mistaking index.html for an API.
    location = /health {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    # Client-side routes such as /login fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
