# Public demo: every visitor who signs in gets a private, short-lived copy of the demo data.
#   just demo
#   docker compose -f compose.yaml -f compose.demo.yaml up --build
# See docs: Розгортання -> Демо-режим.

services:
  db:
    # Each visitor's copy is a separate database with its own small connection pool.
    command: ["postgres", "-c", "max_connections=200"]

  api:
    environment:
      DemoMode__Enabled: "true"
